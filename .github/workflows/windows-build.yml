name: Windows Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Build EMAV Solution (Release)
      run: msbuild VS18\av.sln /p:Configuration=Release /p:Platform=Win32 /nologo /verbosity:minimal
      
    - name: Verify build artifacts
      run: |
        if (!(Test-Path "VS18\Release\aemav.exe")) {
            Write-Error "aemav.exe was not created!"
            exit 1
        }
        if (!(Test-Path "VS18\Release\tstdsp.exe")) {
            Write-Error "tstdsp.exe was not created!"
            exit 1
        }
        if (!(Test-Path "VS18\Release\tstmenu.exe")) {
            Write-Error "tstmenu.exe was not created!"
            exit 1
        }
        Write-Host "Build verified successfully!"
